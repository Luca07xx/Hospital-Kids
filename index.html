<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Kids</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA INICIAL -->
    <div id="telaInicial">

        <h1>HOSPITAL KIDS</h1>
        <p>Explore. Aprenda. Supere desafios.</p>

        <button id="btnJogar">JOGAR</button>

    </div>


    <!-- HOSPITAL -->
    <div id="telaHospital">

        <!-- HUD -->
        <div class="hud">

            <div class="perfil">
                <div class="avatar"></div>

                <div>
                    <strong>Enfermeiro(a) Júnior</strong>
                    <div class="nivel">Nível 1</div>
                </div>
            </div>

            <div class="status">

                <div>
                    ⭐ <span id="estrelas">0</span>
                </div>

                <div>
                    XP <span id="xp">0</span>/100
                </div>

            </div>

        </div>


        <!-- MAPA -->
        <div class="hospital-mapa">

            <div class="corredor"></div>

            <div class="sala sala-higiene" id="btnHigiene">
                <div class="porta"></div>
                <div class="placa">HIGIENE</div>
                <div class="objeto pia-icon"></div>
            </div>


            <div class="sala sala-coracao" id="btnCoracao">

                <div class="porta"></div>
                <div class="placa">CORAÇÃO</div>

                <div class="coracao-icon"></div>

                <div class="cadeado">🔒</div>

            </div>


            <div class="sala sala-cuidados" id="btnCuidados">

                <div class="porta"></div>
                <div class="placa">CUIDADOS</div>

                <div class="maca-icon"></div>

                <div class="cadeado">🔒</div>

            </div>

            <!-- PERSONAGEM -->
            <div class="personagem" id="personagem">

                <img src="itachi.png" alt="Personagem">
                
            </div>

            <!-- INTERAÇÃO -->
            <button class="interacao" id="interacao">
                ENTRAR
            </button>


            <!-- JOYSTICK -->
            <div class="joystick" id="joystick">

                <div
                    class="joystick-botao"
                    id="joystickBotao">
                </div>

            </div>


            <!-- MISSÃO -->
            <div class="missao">

                <small>MISSÃO ATUAL</small>

                <strong>
                    Complete o treinamento de higiene
                </strong>

                <span>
                    +100 XP
                </span>

            </div>

        </div>

    </div>


    <!-- SALA DE HIGIENE -->
    <div id="telaHigiene">

        <div class="sala-jogo">

            <button id="btnUsarPia" class="botao-pia">
                USAR PIA
            </button>

            <div class="placa-sala">
                TREINAMENTO DE HIGIENE
            </div>

            <div id="localPersonagemHigiene"></div>

            <div class="espelho">
                <div class="reflexo"></div>
            </div>

            <div class="pia">

                <div class="torneira" id="torneira">
                    <div class="bica"></div>
                    <div class="agua"></div>
                </div>

                <div class="pia-bacia"></div>

            </div>

            <div class="sabonete" id="sabao">
                <div class="sabao-tampa"></div>
            </div>

            <div class="caixa-instrucao">

                <div id="instrucaoHigiene">
                    Prepare-se para o desafio.
                </div>

                <button id="btnComecar">
                    COMEÇAR
                </button>

            </div>


            <div class="maos">

                <div class="mao mao-esquerda"></div>
                <div class="mao mao-direita"></div>

            </div>


            <div class="barra-progresso">

                <div
                    class="progresso"
                    id="progresso">
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
