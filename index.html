<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Kids</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="telaInicial">

    <h1>🏥 HOSPITAL KIDS</h1>

    <p>Aprenda brincando!</p>

    <button id="btnJogar">▶ JOGAR</button>

    </div>

<div id="telaHospital">

    <div class="jogador-info">
        ⭐ Estrelas: 0
    </div>

    <div class="hospital-mapa">

        <div class="hospital-titulo">
            🏥 HOSPITAL KIDS
        </div>

        <div class="sala sala-higiene" id="btnHigiene">
            <div class="icone-sala">🧼</div>
            <span>Higiene</span>
        </div>

        <div class="sala sala-coracao">
            <div class="icone-sala">❤️</div>
            <span>Coração</span>
        </div>

        <div class="sala sala-cuidados">
            <div class="icone-sala">🌡️</div>
            <span>Cuidados</span>
        </div>

        <div class="joystick" id="joystick">
            <div class="joystick-botao" id="joystickBotao"></div>
        </div>

        <div class="personagem" id="personagem">
            🧑
        </div>

    </div>

</div>

    <div id="telaHigiene">

    <h2>🧼 HIGIENE DAS MÃOS</h2>

    <p>Vamos aprender a lavar as mãos!</p>

    <div class="areaLavagem">

    <div class="torneira" id="torneira">🚰</div>

    <div class="maos">👐</div>

    <div class="sabao" id="sabao">🧼</div>

</div>

<button id="btnComecar">COMEÇAR</button>

<p id="instrucaoHigiene"></p>

</div>

    <script src="script.js"></script>

</body>

</html>
